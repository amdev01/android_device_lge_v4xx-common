interface=wlan0
driver=nl80211
# SoftapController attaches via hostapd/<iface>; point hostapd here so no
# bind-mount is needed (hostapd deletes sockets/ on stop and stale-mounts).
ctrl_interface=/data/misc/wifi/hostapd
ssid=AndroidAP
# Prefer 5 GHz SoftAP (Prima BandCapability=0). Non-DFS UNII-1 ch 36.
# SoftapController still writes WPA2-PSK/CCMP into the runtime hostapd.conf.
hw_mode=a
channel=36
ieee80211n=1
wps_state=0
ignore_broadcast_ssid=0
wowlan_triggers=any

interface=wlan0
driver=nl80211
# SoftapController attaches via hostapd/<iface>; point hostapd here so no
# bind-mount is needed (hostapd deletes sockets/ on stop and stale-mounts).
ctrl_interface=/data/misc/wifi/hostapd
ssid=AndroidAP
# Prefer 5 GHz SoftAP (Prima BandCapability=0). Non-DFS UNII-1 ch 36.
# SoftapController still writes WPA2-PSK/CCMP into the runtime hostapd.conf.
hw_mode=a
channel=36
# Required for 5 GHz SAP: without country_code hostapd may log AP-ENABLED while
# Prima ADD_BSS fails (status 3) and wlan0 stays NO-CARRIER — SSID not scannable.
# Patched SoftapController also emits country_code/ieee80211d into runtime conf;
# keep defaults here as a safety net if an unpatched netd is used.
country_code=GB
ieee80211d=1
# ieee80211n=0 on 5 GHz → Prima ADD_BSS status 3; keep n=1.
ieee80211n=1
wps_state=0
ignore_broadcast_ssid=0
wowlan_triggers=any

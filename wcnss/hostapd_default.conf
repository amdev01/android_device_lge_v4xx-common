interface=wlan0
driver=nl80211
# SoftapController attaches via hostapd/<iface>; point hostapd here so no
# bind-mount is needed (hostapd deletes sockets/ on stop and stale-mounts).
ctrl_interface=/data/misc/wifi/hostapd
ssid=AndroidAP
channel=6
ieee80211n=1
hw_mode=g
ignore_broadcast_ssid=0
wowlan_triggers=any
